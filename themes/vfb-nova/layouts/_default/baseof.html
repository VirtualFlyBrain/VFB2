<!doctype html>
<html lang="{{ .Site.Language.Lang | default "en" }}" data-theme="dark">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ with .Type }}t-{{ . }}{{ end }}{{ if .IsHome }} is-home{{ end }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="progress" aria-hidden="true"></div>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "palette.html" . }}
  {{ partial "scripts.html" . }}
</body>
</html>
